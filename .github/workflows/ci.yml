name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Chocolatey sometimes cannot reach its feed and still exits 0: retry, then make sure ffmpeg is there.
        run: |
          for ($i = 0; $i -lt 3; $i++) {
            choco install ffmpeg -y --no-progress
            if (Test-Path C:\ProgramData\chocolatey\bin\ffmpeg.exe) { break }
            Start-Sleep -Seconds 20
          }
          C:\ProgramData\chocolatey\bin\ffmpeg.exe -version | Select-Object -First 1
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - run: uv run pytest -q

  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  launcher-windows:
    name: launcher (windows, Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        # Chocolatey sometimes cannot reach its feed and still exits 0: retry, then make sure ffmpeg is there.
        run: |
          for ($i = 0; $i -lt 3; $i++) {
            choco install ffmpeg -y --no-progress
            if (Test-Path C:\ProgramData\chocolatey\bin\ffmpeg.exe) { break }
            Start-Sleep -Seconds 20
          }
          C:\ProgramData\chocolatey\bin\ffmpeg.exe -version | Select-Object -First 1
      - name: Write a test .env
        shell: pwsh
        run: |
          Set-Content backend\.env "LLM_API_KEY=ci-test-key`nBILIBILI_COOKIES_BROWSER=`nUNSTUCK_DATA_DIR=data"
      - name: Start with start.ps1 and check both servers answer
        shell: cmd
        env:
          UNSTUCK_NO_OPEN: "1"
          UNSTUCK_SMOKE_TEST: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1
