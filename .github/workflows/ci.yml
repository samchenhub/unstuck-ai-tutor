name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Chocolatey sometimes cannot reach its feed and still exits 0: retry, then make sure ffmpeg is there.
        run: |
          for ($i = 0; $i -lt 3; $i++) {
            choco install ffmpeg -y --no-progress
            if (Test-Path C:\ProgramData\chocolatey\bin\ffmpeg.exe) { break }
            Start-Sleep -Seconds 20
          }
          C:\ProgramData\chocolatey\bin\ffmpeg.exe -version | Select-Object -First 1
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync
      - run: uv run pytest -q

  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # A fresh machine: no uv, ffmpeg or Node installed; the launcher must install what it needs by itself.
  # The web page is built first, as scripts/package.sh does for the packages people download.
  launcher-windows:
    name: launcher (windows, fresh machine)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the web page (as in a package)
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Write a test .env
        shell: pwsh
        run: |
          Set-Content backend\.env "LLM_API_KEY=ci-test-key`nBILIBILI_COOKIES_BROWSER=`nUNSTUCK_DATA_DIR=data"
      - name: Start with Unstuck's own launcher and check it answers
        shell: cmd
        env:
          UNSTUCK_NO_OPEN: "1"
          UNSTUCK_SMOKE_TEST: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1

  launcher-macos:
    name: launcher (macos, fresh machine)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the web page (as in a package)
        run: cd frontend && npm ci && npm run build
      - name: Write a test .env
        run: printf 'LLM_API_KEY=ci-test-key\nBILIBILI_COOKIES_BROWSER=\nUNSTUCK_DATA_DIR=data\n' > backend/.env
      - name: Start with Unstuck's own launcher and check it answers
        env:
          UNSTUCK_NO_OPEN: "1"
          UNSTUCK_SMOKE_TEST: "1"
        run: |
          if command -v uv; then echo "uv is preinstalled on this runner"; fi
          ./start.sh
